<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar | Kanban Board</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/main.min.css">
  <link rel="stylesheet" href="assets/css/calendar.css?v=20260327-1">
  <link rel="stylesheet" href="assets/css/ai-assistant.css?v=20260320-2">
  <link rel="stylesheet" href="assets/css/responsive.css?v=20260324-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js?v=20260317-1"></script>
  <script src="assets/js/app-context.js?v=20260317-1"></script>
  <script src="assets/js/shared-utils.js?v=20260327-1"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
  <script src="assets/js/router.js" defer></script>
  <script src="assets/js/calendar.js?v=20260327-1" defer></script>
  <script src="assets/js/ai-assistant.js?v=20260320-2" defer></script>
</head>
<body>
  <main class="calendar-app">
    <header class="calendar-header">
      <nav class="view-tabs" aria-label="Vistas de proyecto">
        <a class="tab-btn" id="mainViewLink" href="index.html">MAIN</a>
        <a class="tab-btn" id="kanbanViewLink" href="kanban.html">Kanban</a>
        <a class="tab-btn" id="ganttViewLink" href="gantt.html">Gantt Chart</a>
        <a class="tab-btn" id="notesViewLink" href="notas.html">Notas</a>
        <button class="tab-btn is-active" type="button">Calendar</button>
      </nav>
      <button class="btn-refresh" id="refreshCalendar" type="button">Refrescar</button>
    </header>

    <p class="project-context" id="projectContext" aria-live="polite"></p>
    <p class="sync-status is-info" id="syncStatus" aria-live="polite">Esperando sincronizacion...</p>

    
    <section class="summary" aria-label="Resumen de tareas">
      <article class="summary-item">
        <span>Total</span>
        <strong id="totalTasks">0</strong>
      </article>
      <article class="summary-item">
        <span>Con fecha</span>
        <strong id="scheduledTasks">0</strong>
      </article>
      <article class="summary-item">
        <span>Sin fecha</span>
        <strong id="unscheduledTasks">0</strong>
      </article>
      <article class="summary-item summary-item--critical">
        <span>Criticas</span>
        <strong id="criticalTasks">0</strong>
      </article>
    </section>

    <section class="calendar-layout">
      <article class="calendar-panel">
        <div id="calendar" aria-label="Calendario de tareas"></div>
      </article>
    </section>
  </main>
</body>
</html>
