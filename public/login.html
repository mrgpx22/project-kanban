<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Kanban Empresa</title>
  <link rel="stylesheet" href="assets/css/main.css?v=20260313-2">
  <link rel="stylesheet" href="assets/css/login.css?v=20260313-2">
  <link rel="stylesheet" href="assets/css/responsive.css?v=20260324-1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-config.js?v=20260313-2"></script>
  <script src="assets/js/app-context.js?v=20260313-2"></script>
  <script src="assets/js/router.js" defer></script>
  <script src="assets/js/login.js?v=20260313-2" defer></script>
</head>
<body class="login-body">
  <main class="login-app">
    <section class="login-card" aria-labelledby="loginTitle">
      <h1 id="loginTitle">Acceso Kanban</h1>
      <p class="login-subtitle">Inicia sesion con ID (UUID) o email para validar si tu rol es Jefe o User (Trabajador).</p>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="emailInput">ID de usuario (UUID) o Email</label>
          <input id="emailInput" name="identifier" type="text" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="passwordInput">Contrasena</label>
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary login-submit" type="submit">Entrar</button>
      </form>

      <p class="sync-status is-info" id="loginStatus" aria-live="polite">Introduce tus credenciales.</p>
      <p class="login-role" id="loginRole" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
